# UNBUILT / UNTESTED: written on macOS, validated for YAML syntax only.
app-id: io.github.mdmakky.Lumina
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: lumina
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
modules:
  - name: libass
    config-opts: [--disable-static]
    sources:
      - {type: archive, url: "https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz", sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959}
  - name: ffmpeg
    config-opts: [--enable-shared, --disable-static, --disable-doc, --disable-programs, --enable-gpl, --enable-vaapi, --enable-libass]
    sources:
      - {type: git, url: "https://github.com/FFmpeg/FFmpeg.git", tag: n7.1}
  - name: libmpv
    buildsystem: meson
    config-opts: [-Dlibmpv=true, -Dcplayer=false, -Dlua=disabled, -Dvaapi=enabled, -Dgl=enabled, -Dpulse=enabled, -Dwayland=enabled, -Dx11=enabled]
    sources:
      - {type: git, url: "https://github.com/mpv-player/mpv.git", tag: v0.39.0}
  - name: lumina
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    sources:
      - {type: dir, path: ../..}
