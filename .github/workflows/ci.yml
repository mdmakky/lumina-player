name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & Test (Linux, Qt 6.4)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ pkg-config \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            libqt6network6 libqt6sql6-sqlite libgl1-mesa-dri libegl1 \
            libmpv-dev ffmpeg xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Best effort: needs software GL + a generated clip; never fails the job.
      - name: Playback self-test (headless, optional)
        continue-on-error: true
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=20:size=320x240:rate=25 \
            -f lavfi -i sine=duration=20 -shortest -pix_fmt yuv420p /tmp/test.mp4
          LUMINA_PLAYBACK_TEST=1 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 90 xvfb-run -a ./build/bin/lumina /tmp/test.mp4

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt mpv pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # EXPERIMENTAL: never run on Windows by the author. MSYS2 package names below are
  # from memory (qt6-*/mpv/toolchain in the MINGW64 repo); adjust if the job fails.
  build-windows:
    name: Build & Test (Windows, MSYS2 MinGW64)
    runs-on: windows-latest
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-mpv

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage with windeployqt
        run: |
          mkdir -p dist
          cp build/bin/lumina.exe dist/
          windeployqt6 --qmldir ui --no-translations dist/lumina.exe || windeployqt --qmldir ui dist/lumina.exe
          # Bundle libmpv and its MinGW dependencies next to the exe.
          ldd dist/lumina.exe | awk '/mingw64/ {print $3}' | xargs -I{} cp -n {} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-windows-mingw64
          path: dist
